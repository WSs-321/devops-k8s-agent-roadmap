# Secret 示例
# 包含三种常见类型：Opaque（通用）、dockerconfigjson（镜像仓库凭证）、kubernetes.io/tls（证书）
# 注意：data 字段值是 base64 编码；生产环境推荐用 stringData 写明文，K8s 自动转 base64
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: default
  labels:
    app: my-app
type: Opaque
data:
  # echo -n 'mypassword' | base64
  # → bXlwYXNzd29yZA==
  database.password: bXlwYXNzd29yZA==
  # echo -n 'abc123token' | base64
  # → YWJjMTIzdG9rZW4=
  api.token: YWJjMTIzdG9rZW4=
---
# 镜像仓库凭证
# 创建方式：kubectl create secret docker-registry ghcr-login \
#   --docker-server=ghcr.io \
#   --docker-username=WSs-321 \
#   --docker-password=<PAT>
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-login
  namespace: default
type: kubernetes.io/dockerconfigjson
data:
  # 完整 .docker/configjson 文件 base64 编码
  # 内容形如：{"auths":{"ghcr.io":{"username":"...","password":"...","auth":"..."}}}
  .dockerconfigjson: eyJhdXRocyI6eyJnaGNyLmlvIjp7InVzZXJuYW1lIjoiV1NzLTMyMSIsInBhc3N3b3JkIjoiPFBBVD4iLCJhdXRoIjoiV1NzLTMyMTo8UEFUPiJ9fX0=
---
# TLS 证书（自签名示例，生产请用真实 CA 签发）
# 创建方式：kubectl create secret tls app-tls \
#   --cert=path/to/tls.crt --key=path/to/tls.key
apiVersion: v1
kind: Secret
metadata:
  name: app-tls
  namespace: default
type: kubernetes.io/tls
data:
  # 实际部署时用真实证书内容替换
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCkV4YW1wbGUgY2VydGlmaWNhdGUKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCkV4YW1wbGUga2V5Ci0tLS0tRU5EIFBSSVZBVEUgS0VZLS0tLS0K

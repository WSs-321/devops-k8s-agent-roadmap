services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: roadmap:local
    ports:
      - 3000:3000
    environment:
      - PORT=3000
      - GREETING=hello compose
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

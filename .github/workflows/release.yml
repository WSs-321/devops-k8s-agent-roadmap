name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release note
        run: |
          VERSION="${GITHUB_REF_NAME}" bash scripts/gen-release-note.sh > release-note.md

      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-note.md
        env:
          GH_TOKEN: ${{ github.token }}

name: docker CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/Dockerfile'
      - 'app/.dockerignore'
      - '.github/workflows/ci-docker.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/Dockerfile'
      - 'app/.dockerignore'
      - '.github/workflows/ci-docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-docker-image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      img_name: ${{steps.image.outputs.name}}
      img_tags: ${{ steps.metadata.outputs.tags }}
      img_labels: ${{ steps.metadata.outputs.labels }}
      img_digest: ${{ steps.build-docker-image.outputs.digest }}
      trivy_total: ${{ steps.trivy.outputs.total }}
      trivy_critical: ${{ steps.trivy.outputs.critical }}
      trivy_high: ${{ steps.trivy.outputs.high }}
      trivy_status: ${{ steps.trivy.outputs.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      
      - name: Login ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate docker image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=7
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{ version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.metadata.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: 10m

      - name: Upload Trivy scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif


  push-docker-image:
    if: github.event_name != 'pull_request'
    needs: build-docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
      - name: Login ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ needs.build-docker-image.outputs.img_tags }}
          labels: ${{ needs.build-docker-image.outputs.img_labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: output summary
        run: |
          LABELS_FORMATTED=$(echo ${{ needs.build-docker-image.outputs.img_labels }} | sed 's/,/\\n/g')
          cat >> $GITHUB_STEP_SUMMARY <<-'EOF'
          ## Docker Image Summary
          | Key | Value |
          | --------- | ---- |
          | Image Name | ${{ needs.build-docker-image.outputs.img_name }} |
          | Tags | ${{ needs.build-docker-image.outputs.img_tags }} |
          | Labels | ${{ LABELS_FORMATTED }} |
          | Digest | ${{ steps.push.outputs.digest }} |

          ## Trivy Scan Results
          - **Total vulnerabilities**: ${{ needs.build-docker-image.outputs.trivy_total }}
          - **Critical vulnerabilities**: ${{ needs.build-docker-image.outputs.trivy_critical }}
          - **High vulnerabilities**: ${{ needs.build-docker-image.outputs.trivy_high }}
          - **Status**: ${{ needs.build-docker-image.outputs.trivy_status }}
          EOF



